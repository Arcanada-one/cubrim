[package]
name = "cubrim-web-cli"
version = "0.1.0"
edition = "2021"
description = "Command-line encoder/decoder for the Cubrim Web Profile frame (MODE_WEB)"
license-file = "../cubrim-rs/LICENSE"
publish = false

# Why a third crate rather than a subcommand on the shipped `cubrim` CLI or a
# binary inside the decoder crate:
#
#   * The shipped `cubrim` binary is the archiver product. It carries a licence
#     prompt and a stable user-facing surface; a measurement/plumbing tool has
#     no business changing either.
#   * `cubrim-web-decoder` must keep building for wasm32 and must stay free of
#     encoder-side technique (see its manifest comment on the ADR-0003
#     disclosure split). An encoder binary cannot live there.
#
# So this crate is the one place the two independent implementations meet on
# purpose: it ENCODES with `cubrim` and DECODES with `cubrim-web-decoder` — the
# same reference decoder the WASM artefact wraps. A decode number measured here
# is therefore a statement about the decoder that actually ships to browsers,
# not about the encoder's private inverse.

[[bin]]
name = "cubrim-web"
path = "src/main.rs"

[dependencies]
cubrim = { path = "../cubrim-rs" }
cubrim-web-decoder = { path = "../cubrim-web-decoder" }

[dev-dependencies]
blake3 = "1.8.5"

[profile.release]
opt-level = 3
