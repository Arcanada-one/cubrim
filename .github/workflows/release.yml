name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Prevention leg. Refuses to build or publish a tag that is not already
  # reachable from the default branch, and refuses a tag whose version does not
  # match the crate manifest. release-lineage-guard.yml detects the bad state
  # after the fact; this is what stops it from being created — so no legitimate
  # red state ever exists for the detection leg, and a red run there is always
  # a real defect rather than a normal in-between window that gets normalised.
  lineage-gate:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0        # depth-1 has no merge-base; ancestry would be unanswerable
          fetch-tags: true

      - name: Tag must already be on the default branch
        run: bash .github/scripts/check-release-lineage.sh --tag "${GITHUB_REF#refs/tags/}"

  build:
    needs: lineage-gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: linux
            arch: x86_64
            ext: tar.gz
            build: cargo
          - target: aarch64-unknown-linux-gnu
            os: linux
            arch: arm64
            ext: tar.gz
            build: cross
          - target: x86_64-pc-windows-gnu
            os: windows
            arch: x86_64
            ext: zip
            build: cross
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Install cross
        if: matrix.build == 'cross'
        uses: taiki-e/install-action@cross

      - name: Build native target
        if: matrix.build == 'cargo'
        working-directory: code/cubrim-rs
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Build cross target
        if: matrix.build == 'cross'
        working-directory: code/cubrim-rs
        run: cross build --release --locked --target "${{ matrix.target }}"

      - name: Package release asset
        id: package
        working-directory: code/cubrim-rs
        run: |
          asset_path="$(bash scripts/package-release.sh "${{ matrix.target }}" "${{ matrix.os }}" "${{ matrix.arch }}" "${{ matrix.ext }}")"
          echo "asset_path=${asset_path}" >> "$GITHUB_OUTPUT"

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.asset_path }}
            ${{ steps.package.outputs.asset_path }}.sha256
            ${{ steps.package.outputs.asset_path }}.size

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write       # required to create the GitHub Release
      id-token: write       # required for attestation OIDC
      attestations: write   # required for actions/attest-build-provenance
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Prepare release bundle
        run: |
          mkdir -p release
          find dist -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} release/ \;
          : > release/checksums.txt
          for file in release/*.tar.gz release/*.zip; do
            [[ -f "$file" ]] || continue
            sha="$(sha256sum "$file" | awk '{print $1}')"
            printf '%s  %s\n' "$sha" "$(basename "$file")" >> release/checksums.txt
          done

      # Producer side of the self-update trust anchor. Until this has produced
      # at least one attested release, the updater must NOT require an
      # attestation: enforcing it first would strand every installed binary,
      # because the update path is also the repair path. See
      # documentation/ephemeral/research/CUBR-SELFUPDATE-TRUST-20260811.md.
      - name: Attest build provenance (SLSA L2)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/*.tar.gz
            release/*.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            release/*.tar.gz
            release/*.zip
            release/checksums.txt
