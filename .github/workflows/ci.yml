name: ci

on:
  push:
    branches: [main]
    paths:
      - 'code/cubrim-rs/**'
      - 'code/cubrim-web-decoder/**'
      - 'code/cubrim-web-cli/**'
      - 'bench/web-benchmark/**'
      - 'bench/web-corpus/**'
      - 'reproducibility/**'
      - 'chromium/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'code/cubrim-rs/**'
      - 'code/cubrim-web-decoder/**'
      - 'code/cubrim-web-cli/**'
      - 'bench/web-benchmark/**'
      - 'bench/web-corpus/**'
      - 'reproducibility/**'
      - 'chromium/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formatting:
    name: Rust formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: code/cubrim-rs
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check Rust formatting
        run: cargo fmt --check

  clippy:
    name: Clippy lints
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: code/cubrim-rs
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # --all-targets is load-bearing: without it the lib is linted and tests/
      # and benches are not, which reads as a pass while covering half the crate.
      - name: Lint with clippy (warnings are errors)
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

  scheme-roundtrip:
    name: Lossless scheme round-trip
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: code/cubrim-rs
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run the silent-data-loss suite
        run: cargo test --release --locked --test scheme_roundtrip

  reproducibility:
    name: Reproducibility verifier
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: reproducibility
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run verifier tests
        run: python -m pytest --strict-markers test_verify.py

  chromium-harness:
    name: Chromium demo harness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # The pinned content_shell build is a host-only artefact (see
      # chromium/BUILD.md). Keep the portable evidence parser and runner
      # syntax under CI so a stale or tautological verifier cannot land.
      - name: Test structural netlog verifier
        run: python -m unittest chromium.test_netlog_verify

      - name: Shellcheck demo runner
        run: shellcheck chromium/run-demo.sh

  web-decoder:
    name: Web Profile reference decoder
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: code/cubrim-web-decoder
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust with the wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Check formatting
        run: cargo fmt --check

      - name: Build the wasm module
        run: cargo build --release --target wasm32-unknown-unknown

      - name: Differential tests against the cubrim decoder
        run: cargo test --release

      # The JS glue and the HTTP transports run only under Node, so cargo
      # tests alone leave them unexecuted — node-check.mjs and stream-check.mjs
      # existed since CUBR-0077 but ran in no CI job (the enumerated-by-name
      # omission this repo has hit before). Fixtures are produced by the real
      # encoder; the block-size directory makes multi-block frames so the
      # streaming path is exercised through fetch.
      - name: Generate census fixtures (single-block and 4 KiB blocks)
        run: |
          cargo run --release --example make_web_fixtures -- ../../bench/web-corpus/payloads-v2 /tmp/fixtures
          cargo run --release --example make_web_fixtures -- ../../bench/web-corpus/payloads-v2 /tmp/fixtures-4k 4096

      - name: WASM module in Node (decode + streaming)
        run: |
          node web/node-check.mjs target/wasm32-unknown-unknown/release/cubrim_web_decoder.wasm /tmp/fixtures
          node web/stream-check.mjs target/wasm32-unknown-unknown/release/cubrim_web_decoder.wasm /tmp/fixtures-4k

      - name: Content-Encoding cbm end to end
        run: node web/encoding-check.mjs target/wasm32-unknown-unknown/release/cubrim_web_decoder.wasm /tmp/fixtures /tmp/fixtures-4k

  web-cli:
    name: Web Profile CLI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: code/cubrim-web-cli
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --locked --release --all-targets -- -D warnings

      # --locked throughout: the benchmark harness attributes a measurement to
      # a binary by sha256, so a build whose dependency graph can drift under
      # it cannot carry provenance. Same reason cubrim-rs commits its lock.
      #
      # The tests run the built binary as a subprocess against the pinned
      # census, which is the point of the crate: the two-container defect was
      # invisible to every in-process test and appeared the moment real
      # fixtures went through the real artefact.
      - name: Round-trip the web census through the binary
        run: cargo test --locked --release

  cubrimd:
    name: cubrimd reverse proxy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: code/cubrimd
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --locked --release --all-targets -- -D warnings

      # The e2e suite runs a real origin and the real proxy over real HTTP —
      # negotiation legs asserted from the ORIGIN's point of view too, since
      # half the proxy's contract is which Accept-Encoding the origin sees.
      - name: Unit + end-to-end suite
        run: cargo test --locked --release

  web-benchmark-harness:
    name: Web benchmark harness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: bench/web-benchmark
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # This suite decides what may be published as a measurement — which codec
      # is allowlisted, which metric is attributable, what provenance a result
      # must carry. It had never run in CI: ci.yml enumerates paths and jobs by
      # name, and bench/web-benchmark was in neither list, so six test modules
      # sat green by never executing. Discovered while adding a seventh.
      #
      # `unittest discover` is not used: it cannot import this package (the
      # modules sys.path-insert their parent) and would report success having
      # collected nothing.
      # Globbed, never hand-listed. Enumerating by name is exactly the defect
      # above one level down: the seventh module would be added and silently not
      # run. The floor check exists because a glob that matches nothing would
      # otherwise loop zero times and exit 0.
      - name: Harness tests
        run: |
          set -euo pipefail
          shopt -s nullglob
          modules=(tests/test_*.py)
          echo "discovered ${#modules[@]} test modules"
          if [ "${#modules[@]}" -lt 6 ]; then
            echo "expected at least 6 harness test modules, found ${#modules[@]}" >&2
            exit 1
          fi
          for path in "${modules[@]}"; do
            module="tests.$(basename "$path" .py)"
            echo "== $module"
            python -m unittest "$module"
          done

      # bench/web-corpus has its own suite, and it was in no path filter and no
      # job either — the same omission as the harness one, found by following a
      # manifest reference out of the harness directory. It guards the pinned
      # corpus: manifest digests, licence coverage, and that v2 stays frozen.
      - name: Corpus tests
        working-directory: bench/web-corpus
        run: |
          set -euo pipefail
          shopt -s nullglob
          modules=(tests/test_*.py)
          echo "discovered ${#modules[@]} corpus test modules"
          if [ "${#modules[@]}" -lt 3 ]; then
            echo "expected at least 3 corpus test modules, found ${#modules[@]}" >&2
            exit 1
          fi
          for path in "${modules[@]}"; do
            module="tests.$(basename "$path" .py)"
            echo "== $module"
            python -m unittest "$module"
          done
