version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /code/cubrim-rs
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: "pip"
    directory: "/code"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Transitive security fixes need the lockfile refreshed, not package.json
    # edited, so indirect updates must be allowed or scheduled runs simply fail.
    allow:
      - dependency-type: "all"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "pip"
    directory: "/consilium/arbiter"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Transitive security fixes need the lockfile refreshed, not package.json
    # edited, so indirect updates must be allowed or scheduled runs simply fail.
    allow:
      - dependency-type: "all"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "docker"
    directory: "/reproducibility"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Base images are where OS-level CVEs accumulate, and a digest-pinned FROM
    # cannot rot visibly -- nobody reads a sha256 and notices it is a year old.
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
