version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: cargo
    directory: /code/cubrim-rs
    schedule:
      interval: weekly
    # Major bumps of the crypto/IO crates (aes-gcm, argon2, rand, sha2, ureq,
    # dirs) change public APIs and break the lossless round-trip, Clippy and CLI
    # jobs (PR 264). They are handled as deliberate migrations, not bot PRs.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      cargo:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "pip"
    directory: "/code"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Transitive security fixes need the lockfile refreshed, not package.json
    # edited, so indirect updates must be allowed or scheduled runs simply fail.
    allow:
      - dependency-type: "all"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "pip"
    directory: "/consilium/arbiter"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Transitive security fixes need the lockfile refreshed, not package.json
    # edited, so indirect updates must be allowed or scheduled runs simply fail.
    allow:
      - dependency-type: "all"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "docker"
    directory: "/reproducibility"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Base images are where OS-level CVEs accumulate, and a digest-pinned FROM
    # cannot rot visibly -- nobody reads a sha256 and notices it is a year old.
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
